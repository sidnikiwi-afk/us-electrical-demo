name: Zones checks
on:
  pull_request:
  push:
    branches: [main, feat/floor-zones]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
      - name: Geometry, storage and recovery
        run: node --test tests/floor-*.test.js
      - name: Browser tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.61.1
          npx playwright install --with-deps chromium
      - name: Zone journeys on desktop, tablet and phone
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: |
          node tests/floor-zone-browser.mjs
          node tests/floor-zone-safety-browser.mjs
      - name: Wall, containment and print journeys on four screen sizes
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: |
          node tests/floor-wall-browser.mjs
          node tests/floor-route-browser.mjs
          node tests/floor-print-tracer-browser.mjs
          node tests/floor-print-browser.mjs
